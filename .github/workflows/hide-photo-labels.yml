name: Remove photo labels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean-photo-labels:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide photo labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</head>'
          style = '<style>.photo-copy .mini{display:none!important}</style>'
          if style not in s:
              s = s.replace(marker, style + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Hide photo 01 and photo 02 labels'
          git push