name: Fix Mobile Photo Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile photo layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="mobile-photo-fix">'
          if marker in s:
              raise SystemExit(0)
          css = '''<style id="mobile-photo-fix">@media(max-width:800px){html,body{width:100%;max-width:100%;overflow:hidden}.book-wrap{width:100%;height:100dvh;min-height:0;padding:8px 8px 72px;overflow:hidden}.book{width:100%;max-width:100%;height:calc(100dvh - 88px);min-height:0}.page.photo-spread{width:100%;height:100%;padding:16px 12px 28px!important}.photo-layout{width:100%;height:100%;display:grid;grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:4px;overflow:hidden;padding:0}.photo-card,.photo-card.reverse{width:100%;height:100%;min-height:0;grid-template-columns:57% 43%;gap:8px;align-items:center;overflow:hidden}.photo-frame{width:100%;height:88%;min-height:0;padding:5px 5px 18px;transform:rotate(-1deg);overflow:hidden}.photo-card.reverse .photo-frame{transform:rotate(1deg)}.photo-copy{min-width:0;padding:4px 4px 4px 0;overflow:hidden}.photo-copy h3{font-size:clamp(18px,5.5vw,25px);line-height:1.08;margin:0 0 8px}.photo-copy p{font-size:clamp(10px,3.2vw,13px);line-height:1.45;margin:0}.photo-copy .mini{display:none!important}.photo-spread>.num{right:16px;bottom:12px;font-size:9px}.controls{bottom:8px;max-width:calc(100vw - 120px);gap:5px;padding:7px 9px}.controls .next{padding:0 12px;font-size:9px}.music{right:8px;bottom:8px;width:42px;height:42px}.hint{right:55px;bottom:17px;font-size:9px;padding:5px 7px}}@media(max-width:480px){.book-wrap{padding:6px 6px 70px}.book{height:calc(100dvh - 84px)}.page.photo-spread{padding:12px 9px 24px!important}.photo-card,.photo-card.reverse{grid-template-columns:56% 44%;gap:7px}.photo-frame{height:86%;padding:4px 4px 16px}.photo-copy h3{font-size:20px;line-height:1.05;margin-bottom:6px}.photo-copy p{font-size:10.5px;line-height:1.4}.photo-spread>.num{right:12px;bottom:8px}} </style>'''
          s = s.replace('</style></head>', '</style>'+css+'</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix mobile photo pages"
          git push
