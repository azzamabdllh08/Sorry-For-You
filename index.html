<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8f7567"><title>Untuk Varadilla — Sebuah Surat dari Azzam</title><style>:root{--paper:#fdf9f4;--ink:#493b34;--muted:#786b63;--accent:#8b6c5b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 20%,#f5eee8,#dfd1c7 75%);color:var(--ink);font-family:Arial,sans-serif}body{overflow:hidden}.cover{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#eee2da,#d1b8a9);transition:opacity .9s,visibility .9s}.cover.hide{opacity:0;visibility:hidden;pointer-events:none}.cover-book{width:min(88vw,440px);height:min(78vh,620px);min-height:500px;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(110deg,#604b40,#795f50);border-radius:5px 18px 18px 5px;box-shadow:35px 30px 70px #38281f45,inset 7px 0 #4b392f}.cover-book:before{content:'';position:absolute;left:18px;top:18px;bottom:18px;width:2px;background:#cdb7a7aa}.cover-content{text-align:center;color:#fbf3ec;padding:45px 34px}.cover-content .small{font-size:10px;letter-spacing:.35em;text-transform:uppercase;opacity:.8}.cover-content h1{font:500 clamp(54px,12vw,86px)/.86 Georgia,serif;margin:35px 0 24px}.cover-content p{font:italic 17px Georgia,serif;opacity:.9}.open{margin-top:40px;border:1px solid #fff8;background:#fff1;color:#fff;padding:14px 25px;border-radius:999px;letter-spacing:.15em;text-transform:uppercase;font-size:11px;cursor:pointer}.book-wrap{height:100vh;display:grid;place-items:center;padding:25px}.book{width:min(1050px,94vw);height:min(700px,88vh);position:relative;perspective:2200px;filter:drop-shadow(0 25px 50px #3c2e271f)}.book:before{content:'';position:absolute;left:50%;top:3%;bottom:3%;width:2px;background:#cbb8aa55;z-index:4}.page{position:absolute;top:0;width:50%;height:100%;background:var(--paper);overflow:hidden;box-shadow:inset 0 0 35px #6a51401a}.page.left{left:0;border-radius:10px 0 0 10px;padding:clamp(42px,5vw,70px) clamp(34px,5vw,65px)}.page.right{right:0;border-radius:0 10px 10px 0;padding:clamp(42px,5vw,70px) clamp(34px,5vw,65px)}.page.blank{background:linear-gradient(90deg,#fdf9f4,#faf4ee)}.page-content{height:100%;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.kicker{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}.page h2{font:500 clamp(34px,4.3vw,58px)/1.02 Georgia,serif;margin:0 0 24px;max-width:650px}.page p{font-size:clamp(14px,1.35vw,17px);line-height:1.8;color:var(--muted);margin:0 0 17px;max-width:650px}.quote{font:italic clamp(21px,2.2vw,31px)/1.4 Georgia,serif;color:var(--ink);border-left:2px solid var(--accent);padding-left:20px;margin-top:5px;max-width:650px}.num{position:absolute;bottom:25px;right:45px;font-size:10px;letter-spacing:.2em;color:#9b8a80}.right.turning{animation:pageTurn .68s cubic-bezier(.65,0,.35,1)}@keyframes pageTurn{0%{transform:rotateY(0);opacity:1}45%{transform:rotateY(-82deg);opacity:.45}100%{transform:rotateY(0);opacity:1}}.photo-page{padding:24px!important}.photo{width:100%;height:100%;object-fit:cover;border-radius:5px}.photo-page:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 50%,#21171170);pointer-events:none}.photo-caption{position:absolute;bottom:55px;left:55px;right:55px;color:#fff;font:italic clamp(22px,2.5vw,31px)/1.3 Georgia,serif;z-index:2}.photo-page .num{color:#fff;z-index:3}.controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:16px;background:#fbf8f4ee;padding:9px 12px;border-radius:999px;box-shadow:0 12px 35px #3c2d251c}.controls button{border:0;background:transparent;color:var(--ink);cursor:pointer;font-size:18px;width:38px;height:34px}.controls button:disabled{opacity:.3;cursor:not-allowed}.controls .next{background:#6e5649;color:#fff;border-radius:999px;width:auto;padding:0 18px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.counter{font-size:10px;color:#8c7c73;min-width:50px;text-align:center}.music{position:fixed;right:20px;bottom:22px;z-index:31;width:44px;height:44px;border:1px solid #6b544626;border-radius:50%;background:#fbf8f4ee;color:#6e5649}.music.on{background:#6e5649;color:#fff}.hint{position:fixed;right:72px;bottom:30px;font-size:10px;color:#7c6b62;background:#fbf8f4dd;padding:6px 10px;border-radius:20px;z-index:31}@media(max-width:700px){.book-wrap{padding:12px 10px 75px}.book{width:94vw;height:78vh;min-height:500px;max-height:720px}.book:before{display:none}.page.left,.page.right{left:0;right:auto;width:100%;border-radius:9px;padding:38px 28px}.page.left{display:none}.page.right{display:block}.page h2{font-size:clamp(34px,9vw,45px);line-height:1.02;margin-bottom:20px}.page p{font-size:15px;line-height:1.75}.quote{font-size:22px;line-height:1.4}.num{right:28px;bottom:22px}.photo-page{padding:14px!important}.photo-caption{left:25px;right:25px;bottom:35px;font-size:20px}.controls{bottom:14px}.music{bottom:14px;right:14px}.hint{bottom:22px;right:64px}.cover-book{height:76vh;min-height:480px}}@media(max-height:650px) and (min-width:701px){.book{height:86vh}.page{padding-top:35px;padding-bottom:45px}.page h2{font-size:42px}.page p{font-size:14px;line-height:1.65}}</style></head><body><div class="cover" id="cover"><div class="cover-book"><div class="cover-content"><div class="small">sebuah surat dari hati</div><h1>Untuk<br>Varadilla</h1><p>tentang maaf, kepastian, dan masa depan.</p><button class="open" id="open">Buka Buku ♡</button></div></div></div><div class="book-wrap"><div class="book"><div class="page left" id="leftPage"></div><div class="page right" id="rightPage"></div></div></div><div class="controls"><button id="prev" aria-label="Halaman sebelumnya">‹</button><div class="counter" id="counter">1–2 / 8</div><button class="next" id="next">Halaman berikutnya →</button></div><button class="music" id="music" aria-label="Musik">♫</button><div class="hint" id="hint">musik</div><script>const pages=[{title:'Aku datang bukan untuk membela diri.',k:'01 · pembuka',text:'Aku datang untuk mengakui kesalahanku, meminta maaf kepadamu, dan mengatakan sesuatu yang mungkin selama ini belum kusampaikan dengan baik.',quote:'“Kali ini, aku ingin benar-benar mendengarkan.”'},{title:'Maaf, sayang.',k:'02 · permintaan maaf',text:'Aku tahu kata “maaf” tidak otomatis menghapus rasa sakit yang sudah kamu rasakan. Aku juga tahu penjelasan panjang tidak akan membuat kesalahanku menjadi benar. Kalau sikapku membuat kamu sedih, kecewa, marah, atau merasa tidak dihargai, aku benar-benar menyesal.',text2:'Aku sadar mencintai seseorang bukan hanya soal mengatakan sayang. Cinta juga berarti tahu kapan harus mendengarkan, menahan ego, dan belajar menjadi lebih baik.',quote:'“Aku tidak ingin mencari alasan. Aku ingin memperbaiki kesalahanku.”'},{title:'Aku tahu kamu merasa kita berjalan di tempat.',k:'03 · yang kamu rasakan',text:'Aku mengerti kenapa kamu merasa hubungan ini seperti tidak bergerak ke mana-mana. Kamu bukan meminta sesuatu yang berlebihan. Kamu hanya ingin tahu bahwa hubungan ini punya arah, bahwa menunggu selama ini bukan tanpa tujuan.',quote:'“Aku mengerti bahwa yang kamu cari bukan sekadar kata-kata.”'},{title:'Kamu butuh kepastian.',k:'04 · yang kamu butuhkan',text:'Kamu ingin tahu apakah aku benar-benar serius. Kamu ingin ada arah yang jelas dan masa depan yang bisa kita perjuangkan bersama. Dan aku sadar, selama ini aku belum cukup membuatmu merasa yakin tentang itu.',quote:'“Kamu berhak mendapatkan kepastian, bukan terus hidup dalam pertanyaan.”'},{title:'Aku masih memilih kamu.',k:'05 · pilihanku',text:'Aku tidak ingin hubungan kita berjalan tanpa tujuan. Aku ingin memperjuangkan hubungan ini menuju sesuatu yang lebih pasti. Aku ingin menjadi laki-laki yang berani mengambil langkah, bukan hanya mengatakan “nanti”.',quote:'“Aku tidak ingin kamu menebak-nebak lagi tentang keseriusanku.”'},{title:'Aku ingin memberi kita masa depan yang jelas.',k:'06 · langkah nyata',text:'Aku akan lebih terbuka tentang rencanaku, membicarakan masa depan kita dengan serius, dan membuktikan keseriusanku melalui tindakan. Kepastian bukan sesuatu yang cukup diucapkan sekali; kepastian harus dibangun dan dibuktikan.',text2:'Dan secepatnya aku akan bicara dengan mamamu. Aku ingin menyampaikan keseriusanku, menjelaskan niatku dengan baik, dan berusaha membuat mamamu yakin bahwa aku sungguh-sungguh dengan kamu serta masa depan yang ingin kita bangun bersama.',quote:'“Aku ingin langkahku ke depan punya tujuan: kita.”'},{photo:'images/2.jpg',caption:'Dari semua kenangan ini, aku tidak ingin ceritanya berhenti di sini.',k:'07 · kenangan'},{photo:'images/7.jpg',caption:'Aku ingin punya lebih banyak hari sederhana seperti ini bersamamu.',k:'08 · harapan'}];let current=0;const left=document.getElementById('leftPage'),right=document.getElementById('rightPage'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next');function markup(p){if(!p)return '';if(p.photo)return `<div class="page-content photo-page"><img class="photo" src="${p.photo}" alt="Kenangan Azzam dan Varadilla"><div class="photo-caption">${p.caption}</div><div class="num">${p.k}</div></div>`;return `<div class="page-content"><div class="kicker">${p.k}</div><h2>${p.title}</h2><p>${p.text}</p>${p.text2?`<p>${p.text2}</p>`:''}${p.quote?`<div class="quote">${p.quote}</div>`:''}<div class="num">${p.k}</div></div>`}function render(animate=false){if(current===0){left.classList.remove('blank');left.style.display='block';left.innerHTML=markup(pages[0]);right.innerHTML=markup(pages[1]);counter.textContent='1–2 / 8'}else{left.innerHTML='';left.style.display='block';left.classList.add('blank');right.innerHTML=markup(pages[current]);counter.textContent=`${current+1} / ${pages.length}`}prev.disabled=current===0;next.textContent=current===pages.length-1?'Kembali ke awal ↺':'Halaman berikutnya →';if(animate){right.classList.remove('turning');void right.offsetWidth;right.classList.add('turning')}}function go(n){if(n<0||n>=pages.length)return;current=n;render(true)}document.getElementById('open').onclick=()=>{document.getElementById('cover').classList.add('hide');render();startMusic()};next.onclick=()=>{if(current===pages.length-1)go(0);else go(current+1)};prev.onclick=()=>{if(current>0)go(current-1)};addEventListener('keydown',e=>{if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft'&&!prev.disabled)prev.click()});render();let ctx,master,playing=false,timer,step=0;function tone(f,d,v,w){let t=ctx.currentTime+w,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}function startMusic(){if(playing)return;ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.75;master.connect(ctx.destination);playing=true;music.classList.add('on');hint.textContent='musik 75%';const c=[[146.83,174.61,220],[130.81,164.81,196],[110,130.81,164.81],[98,146.83,185]];function play(){if(!playing)return;let a=c[step%4];a.forEach((f,i)=>tone(f,4.5,.07,i*.12));tone(a[2]*2,2.7,.04,1.1);step++;timer=setTimeout(play,4500)}play()}function stopMusic(){playing=false;clearTimeout(timer);if(master)master.gain.setTargetAtTime(.0001,ctx.currentTime,.15);music.classList.remove('on');hint.textContent='musik mati'}music.onclick=()=>playing?stopMusic():startMusic();</script></body></html>
