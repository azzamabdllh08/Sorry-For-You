<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8f7567"><title>Untuk Varadilla — Sebuah Surat dari Azzam</title><style>:root{--paper:#fdf9f4;--ink:#493b34;--muted:#786b63;--accent:#8b6c5b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 20%,#f7efe9,#ded0c6);color:var(--ink);font-family:Arial,sans-serif}.cover{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#eee2da,#d1b8a9);transition:.8s}.cover.hide{opacity:0;visibility:hidden;pointer-events:none}.cover-book{width:min(88vw,440px);height:min(78vh,620px);min-height:500px;display:grid;place-items:center;background:linear-gradient(110deg,#604b40,#795f50);border-radius:5px 18px 18px 5px;box-shadow:35px 30px 70px #38281f45,inset 7px 0 #4b392f;position:relative}.cover-book:before{content:'';position:absolute;left:18px;top:18px;bottom:18px;width:2px;background:#cdb7a7aa}.cover-content{text-align:center;color:#fbf3ec;padding:45px 34px}.small,.kicker{font-size:10px;letter-spacing:.3em;text-transform:uppercase}.cover-content h1{font:500 clamp(54px,12vw,86px)/.86 Georgia,serif;margin:35px 0 24px}.cover-content p{font:italic 17px Georgia,serif;opacity:.9}.open{margin-top:40px;border:1px solid #fff8;background:#fff1;color:#fff;padding:14px 25px;border-radius:999px;letter-spacing:.15em;text-transform:uppercase;font-size:11px;cursor:pointer}.book-wrap{height:100vh;display:grid;place-items:center;padding:22px 22px 82px}.book{width:min(1180px,96vw);height:min(720px,86vh);position:relative;filter:drop-shadow(0 25px 50px #3c2e2730)}.page{position:absolute;inset:0;background:var(--paper);border-radius:12px;box-shadow:inset 0 0 40px #6a51401a;overflow:hidden;padding:clamp(38px,5vw,70px) clamp(32px,6vw,80px)}.page-content{height:100%;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.kicker{color:var(--accent);margin-bottom:18px}.page h2{font:500 clamp(38px,5vw,66px)/1.02 Georgia,serif;margin:0 0 25px;max-width:900px}.page p{font-size:clamp(15px,1.45vw,18px);line-height:1.75;color:var(--muted);margin:0 0 19px;max-width:900px}.quote{font:italic clamp(22px,2.5vw,34px)/1.4 Georgia,serif;border-left:2px solid var(--accent);padding-left:22px;margin-top:6px;max-width:850px}.num{position:absolute;bottom:25px;right:50px;font-size:10px;letter-spacing:.2em;color:#9b8a80}.page.enter-next{animation:next .45s ease both}.page.enter-prev{animation:prev .45s ease both}@keyframes next{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}@keyframes prev{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}.photo-spread{padding:28px!important}.photo-layout{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:24px}.photo-card{position:relative;display:grid;grid-template-columns:72% 28%;gap:16px;align-items:center;min-width:0}.photo-card.reverse{grid-template-columns:28% 72%}.photo-card.reverse .photo-frame{order:2}.photo-card.reverse .photo-copy{order:1}.photo-frame{height:82%;position:relative;background:#eee3d8;padding:10px 10px 30px;box-shadow:0 12px 28px #47372d20;transform:rotate(-1.3deg)}.photo-card.reverse .photo-frame{transform:rotate(1.3deg)}.photo-frame:before{content:'';position:absolute;top:-8px;left:50%;width:74px;height:24px;transform:translateX(-50%) rotate(-2deg);background:#d5bfae99;z-index:2}.photo-frame img{width:100%;height:100%;display:block;object-fit:cover}.photo-copy{padding:8px 8px 8px 2px}.photo-copy h3{font:500 clamp(24px,2.4vw,38px)/1.05 Georgia,serif;margin:0 0 15px}.photo-copy p{font-size:clamp(12px,1.05vw,15px);line-height:1.65;color:var(--muted);margin:0}.photo-copy .mini{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}.closing{background:linear-gradient(145deg,#e7d7cd,#cfb5a6)}.closing .page-content{text-align:center;align-items:center}.closing h2{font-size:clamp(48px,7vw,88px)}.closing p{max-width:690px}.final{font:italic clamp(28px,3vw,40px)/1.3 Georgia,serif;margin-top:12px}.controls{position:fixed;left:50%;bottom:19px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:14px;background:#fbf8f4ee;padding:9px 12px;border-radius:999px;box-shadow:0 12px 35px #3c2d251c}.controls button{border:0;background:transparent;color:var(--ink);cursor:pointer;font-size:18px;width:38px;height:34px}.controls .next{background:#6e5649;color:#fff;border-radius:999px;width:auto;padding:0 18px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.counter{font-size:10px;color:#8c7c73;min-width:48px;text-align:center}.music{position:fixed;right:20px;bottom:19px;z-index:31;width:46px;height:46px;border:1px solid #6b544626;border-radius:50%;background:#fbf8f4ee;color:#6e5649;cursor:pointer}.music.on{background:#6e5649;color:#fff}.hint{position:fixed;right:76px;bottom:29px;font-size:10px;color:#7c6b62;background:#fbf8f4dd;padding:6px 10px;border-radius:20px;z-index:31}@media(max-width:800px){.book-wrap{padding:10px 10px 72px}.book{width:96vw;height:80vh;min-height:520px}.page{padding:38px 27px}.page h2{font-size:clamp(34px,9vw,50px)}.page p{font-size:15px;line-height:1.7}.quote{font-size:22px}.photo-spread{padding:20px!important}.photo-layout{grid-template-columns:1fr;gap:10px;overflow:auto;padding-bottom:18px}.photo-card,.photo-card.reverse{grid-template-columns:58% 42%;gap:10px;min-height:44vh}.photo-frame{height:88%;padding:7px 7px 22px}.photo-copy h3{font-size:25px}.photo-copy p{font-size:12px;line-height:1.55}.photo-copy .mini{font-size:8px}.num{right:25px;bottom:20px}.controls{bottom:10px}.music{right:12px;bottom:10px}.hint{right:63px;bottom:21px}.cover-book{height:76vh;min-height:480px}}@media(max-width:480px){.photo-layout{display:grid;grid-template-columns:1fr;gap:10px}.photo-card,.photo-card.reverse{grid-template-columns:60% 40%;min-height:42vh}.photo-copy h3{font-size:22px}.photo-copy p{font-size:11.5px}.page{padding:34px 23px}.page h2{font-size:38px}.page p{font-size:14px}.cover-book{min-height:480px;height:75vh}}</style></head><body><div class="cover" id="cover"><div class="cover-book"><div class="cover-content"><div class="small">sebuah surat dari hati</div><h1>Untuk<br>Varadilla</h1><p>tentang maaf, kepastian, dan masa depan.</p><button class="open" id="open">Buka Buku ♡</button></div></div></div><div class="book-wrap"><div class="book"><div class="page" id="page"></div></div></div><div class="controls"><button id="prev">‹</button><div class="counter" id="counter">1 / 13</div><button class="next" id="next">Halaman berikutnya →</button></div><button class="music" id="music">♫</button><div class="hint" id="hint">musik 75%</div><script>const pages=[{k:'01 · pembuka',title:'Aku datang bukan untuk membela diri.',text:'Aku datang untuk mengakui kesalahanku, meminta maaf kepadamu, dan mengatakan sesuatu yang mungkin selama ini belum kusampaikan dengan baik.',quote:'“Kali ini, aku ingin benar-benar mendengarkan.”'},{k:'02 · permintaan maaf',title:'Maaf, sayang.',text:'Aku tahu kata “maaf” tidak otomatis menghapus rasa sakit yang sudah kamu rasakan. Aku juga tahu penjelasan panjang tidak akan membuat kesalahanku menjadi benar. Karena itu, kali ini aku tidak ingin mencari alasan.',text2:'Kalau sikapku membuat kamu sedih, kecewa, marah, atau merasa tidak dihargai, aku benar-benar menyesal. Maaf karena ada saat-saat ketika aku terlalu sibuk dengan perasaanku sendiri sampai lupa bahwa kamu juga punya hati yang harus aku jaga. Aku sadar, mencintai seseorang bukan hanya soal mengatakan sayang. Cinta juga berarti tahu kapan harus mendengarkan, menahan ego, dan belajar menjadi lebih baik.',quote:'“Jadi untuk semua yang membuatmu terluka karena aku: maaf, sayang. — Azzam”'},{k:'03 · yang kamu rasakan',title:'Aku tahu kamu merasa kita berjalan di tempat.',text:'Aku mengerti kenapa kamu merasa hubungan ini seperti tidak bergerak ke mana-mana. Kamu bukan meminta sesuatu yang berlebihan. Kamu hanya ingin tahu bahwa hubungan ini punya arah, bahwa menunggu selama ini bukan tanpa tujuan.',quote:'“Aku mengerti bahwa yang kamu cari bukan sekadar kata-kata.”'},{k:'04 · yang kamu butuhkan',title:'Kamu butuh kepastian.',text:'Kamu ingin tahu apakah aku benar-benar serius. Kamu ingin ada arah yang jelas dan masa depan yang bisa kita perjuangkan bersama. Dan aku sadar, selama ini aku belum cukup membuatmu merasa yakin tentang itu.',quote:'“Kamu berhak mendapatkan kepastian, bukan terus hidup dalam pertanyaan.”'},{k:'05 · pilihanku',title:'Aku masih memilih kamu.',text:'Aku tidak ingin hubungan kita berjalan tanpa tujuan. Aku ingin memperjuangkan hubungan ini menuju sesuatu yang lebih pasti. Aku ingin menjadi laki-laki yang berani mengambil langkah, bukan hanya mengatakan “nanti”.',quote:'“Aku tidak ingin kamu menebak-nebak lagi tentang keseriusanku.”'},{k:'06 · langkah nyata',title:'Aku ingin memberi kita masa depan yang jelas.',text:'Aku akan lebih terbuka tentang rencanaku, membicarakan masa depan kita dengan serius, dan membuktikan keseriusanku melalui tindakan. Kepastian bukan sesuatu yang cukup diucapkan sekali; kepastian harus dibangun dan dibuktikan.',text2:'Dan secepatnya aku akan bicara dengan mamamu. Aku ingin menyampaikan keseriusanku, menjelaskan niatku dengan baik, dan berusaha membuat mamamu yakin bahwa aku sungguh-sungguh dengan kamu serta masa depan yang ingin kita bangun bersama.',quote:'“Aku ingin langkahku ke depan punya tujuan: kita.”'},{k:'07 · kenangan',title:'Aku tidak ingin kenangan ini berhenti di sini.',text:'Setiap foto di halaman berikutnya mengingatkanku bahwa hubungan ini punya banyak momen yang berarti. Aku tidak ingin menghapus semua itu hanya karena aku pernah gagal menjaga perasaanmu.',quote:'“Aku ingin memperbaiki yang salah, bukan melupakan yang pernah indah.”'},{k:'08 · harapan',title:'Aku ingin lebih banyak hari seperti ini.',text:'Aku ingin kita punya lebih banyak cerita. Bukan hanya cerita yang indah, tetapi juga cerita tentang dua orang yang belajar menjadi dewasa, saling memahami, dan berani menentukan masa depan.',quote:'“Kalau kamu masih memberi ruang, aku ingin mengisinya dengan keseriusan.”'},{photos:[['images/1.jpg','09 · foto 01','Momen pertama.','Aku bersyukur pernah punya cerita ini.'],['images/2.jpg','10 · foto 02','Senyum yang ingin aku lihat lagi.','Ada banyak hal sederhana tentang kita yang ternyata sangat berarti.']]},{photos:[['images/3.jpg','11 · foto 03','Tawa kecil yang aku rindukan.','Aku ingin kembali membuatmu tersenyum tanpa rasa khawatir.'],['images/4.jpg','12 · foto 04','Hari sederhana kita.','Bukan tempatnya yang penting, tapi dengan siapa aku menjalaninya.']]},{photos:[['images/5.jpg','13 · foto 05','Satu lagi yang ingin aku simpan.','Aku tidak ingin kesalahan hari ini menghapus arti dari semua yang pernah kita jalani.'],['images/6.jpg','14 · foto 06','Momen yang berharga.','Terima kasih sudah pernah menjadi tempat paling nyaman untukku.']]},{photos:[['images/7.jpg','15 · foto 07','Aku masih ingin bersama.','Aku ingin memperbaiki diri dan membuat hubungan ini punya arah.'],['images/8.jpg','16 · foto 08','Semoga bukan akhir.','Aku ingin setelah semua ini, kita masih punya banyak halaman untuk ditulis bersama.']]},{closing:true,k:'17 · penutup',title:'Maaf, ya sayang.',text:'Aku tidak tahu apakah kata-kata ini cukup. Mungkin tidak. Tapi aku ingin kamu tahu bahwa aku benar-benar menyesal. Aku sayang kamu, dan kalau masih ada kesempatan, aku ingin memperbaiki semuanya dengan cara yang lebih dewasa.',final:'Aku masih memilih kamu. — Azzam ♡'}];let current=0;const page=document.getElementById('page'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next');function markup(p){if(p.photos)return `<div class="photo-layout">${p.photos.map((x,i)=>`<article class="photo-card ${i%2?'reverse':''}"><div class="photo-frame"><img src="${x[0]}" alt="Kenangan Azzam dan Varadilla"></div><div class="photo-copy"><div class="mini">${x[1]}</div><h3>${x[2]}</h3><p>${x[3]}</p></div></article>`).join('')}</div><div class="num">${p.photos[0][1].split(' · ')[0]}–${p.photos[1][1].split(' · ')[0]}</div>`;if(p.closing)return `<div class="page-content closing"><div class="kicker">${p.k}</div><h2>${p.title}</h2><p>${p.text}</p><div class="final">${p.final}</div></div>`;return `<div class="page-content"><div class="kicker">${p.k}</div><h2>${p.title}</h2><p>${p.text}</p>${p.text2?`<p>${p.text2}</p>`:''}${p.quote?`<div class="quote">${p.quote}</div>`:''}<div class="num">${p.k}</div></div>`}function render(dir='next'){page.classList.remove('enter-next','enter-prev');void page.offsetWidth;page.innerHTML=markup(pages[current]);page.classList.add(dir==='prev'?'enter-prev':'enter-next');counter.textContent=`${current+1} / ${pages.length}`;prev.disabled=current===0;next.textContent=current===pages.length-1?'Kembali ke awal ↺':'Halaman berikutnya →'}function go(n){if(n<0||n>=pages.length)return;let d=n>current?'next':'prev';current=n;render(d)}document.getElementById('open').onclick=()=>{document.getElementById('cover').classList.add('hide');render();startMusic()};next.onclick=()=>current===pages.length-1?go(0):go(current+1);prev.onclick=()=>go(current-1);addEventListener('keydown',e=>{if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft'&&!prev.disabled)prev.click()});render();let ctx,master,playing=false,timer,step=0;function tone(f,d,v,w){let t=ctx.currentTime+w,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}function startMusic(){if(playing)return;ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.75;master.connect(ctx.destination);playing=true;music.classList.add('on');hint.textContent='musik 75%';const c=[[146.83,174.61,220],[130.81,164.81,196],[110,130.81,164.81],[98,146.83,185]];function play(){if(!playing)return;let a=c[step%4];a.forEach((f,i)=>tone(f,4.5,.07,i*.12));tone(a[2]*2,2.7,.04,1.1);step++;timer=setTimeout(play,4500)}play()}function stopMusic(){playing=false;clearTimeout(timer);if(master)master.gain.setTargetAtTime(.0001,ctx.currentTime,.15);music.classList.remove('on');hint.textContent='musik mati'}music.onclick=()=>playing?stopMusic():startMusic();</script></body></html>
