<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8f7567"><title>Untuk Varadilla — Sebuah Surat dari Azzam</title><style>:root{--paper:#fdf9f4;--ink:#493b34;--muted:#786b63;--accent:#8b6c5b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 20%,#f5eee8,#dfd1c7 75%);color:var(--ink);font-family:Arial,sans-serif}body{overflow:hidden}.cover{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#eee2da,#d1b8a9);transition:opacity .9s,visibility .9s}.cover.hide{opacity:0;visibility:hidden;pointer-events:none}.cover-book{width:min(88vw,440px);height:min(78vh,620px);min-height:500px;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(110deg,#604b40,#795f50);border-radius:5px 18px 18px 5px;box-shadow:35px 30px 70px #38281f45,inset 7px 0 #4b392f}.cover-book:before{content:'';position:absolute;left:18px;top:18px;bottom:18px;width:2px;background:#cdb7a7aa}.cover-content{text-align:center;color:#fbf3ec;padding:45px 34px}.cover-content .small{font-size:10px;letter-spacing:.35em;text-transform:uppercase;opacity:.8}.cover-content h1{font:500 clamp(54px,12vw,86px)/.86 Georgia,serif;margin:35px 0 24px}.cover-content p{font:italic 17px Georgia,serif;opacity:.9}.open{margin-top:40px;border:1px solid #fff8;background:#fff1;color:#fff;padding:14px 25px;border-radius:999px;letter-spacing:.15em;text-transform:uppercase;font-size:11px;cursor:pointer}.book-wrap{height:100vh;display:grid;place-items:center;padding:25px}.book{width:min(1050px,94vw);height:min(700px,88vh);position:relative;filter:drop-shadow(0 25px 50px #3c2e271f)}.page{position:absolute;inset:0;background:var(--paper);border-radius:10px;box-shadow:inset 0 0 35px #6a51401a;padding:clamp(45px,6vw,75px) clamp(38px,8vw,110px);overflow:hidden}.page-content{height:100%;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.kicker{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}.page h2{font:500 clamp(38px,5vw,62px)/1.02 Georgia,serif;margin:0 0 26px;max-width:850px}.page p{font-size:clamp(15px,1.55vw,18px);line-height:1.8;color:var(--muted);margin:0 0 20px;max-width:850px}.quote{font:italic clamp(23px,2.6vw,34px)/1.4 Georgia,serif;color:var(--ink);border-left:2px solid var(--accent);padding-left:22px;margin-top:8px;max-width:850px}.num{position:absolute;bottom:30px;right:55px;font-size:10px;letter-spacing:.2em;color:#9b8a80}.page.enter-next{animation:enterNext .48s ease both}.page.enter-prev{animation:enterPrev .48s ease both}@keyframes enterNext{0%{opacity:0;transform:translateX(35px)}100%{opacity:1;transform:none}}@keyframes enterPrev{0%{opacity:0;transform:translateX(-35px)}100%{opacity:1;transform:none}}.photo-page{padding:25px!important}.photo{width:100%;height:100%;object-fit:cover;border-radius:6px}.photo-page:after{content:'';position:absolute;inset:25px;background:linear-gradient(transparent 48%,#21171178);border-radius:6px;pointer-events:none}.photo-caption{position:absolute;bottom:70px;left:80px;right:80px;color:#fff;font:italic clamp(24px,3vw,36px)/1.3 Georgia,serif;z-index:2}.photo-page .num{color:#fff;z-index:3}.closing{background:linear-gradient(145deg,#e7d7cd,#cfb5a6)}.closing .page-content{text-align:center;align-items:center}.closing h2{font-size:clamp(48px,7vw,84px);line-height:.95;max-width:850px}.closing p{max-width:680px}.closing .final{font:italic clamp(27px,3vw,40px)/1.3 Georgia,serif;color:var(--ink);margin-top:12px}.controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:16px;background:#fbf8f4ee;padding:9px 12px;border-radius:999px;box-shadow:0 12px 35px #3c2d251c}.controls button{border:0;background:transparent;color:var(--ink);cursor:pointer;font-size:18px;width:38px;height:34px}.controls .next{background:#6e5649;color:#fff;border-radius:999px;width:auto;padding:0 18px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.controls .counter{font-size:10px;color:#8c7c73;min-width:48px;text-align:center}.music{position:fixed;right:20px;bottom:22px;z-index:31;width:44px;height:44px;border:1px solid #6b544626;border-radius:50%;background:#fbf8f4ee;color:#6e5649}.music.on{background:#6e5649;color:#fff}.hint{position:fixed;right:72px;bottom:30px;font-size:10px;color:#7c6b62;background:#fbf8f4dd;padding:6px 10px;border-radius:20px;z-index:31}@media(max-width:700px){.book-wrap{padding:14px 10px 75px}.book{width:94vw;height:78vh;min-height:500px;max-height:720px}.page{border-radius:9px;padding:42px 28px}.page h2{font-size:clamp(35px,9vw,47px);line-height:1.03;margin-bottom:21px}.page p{font-size:15px;line-height:1.75;margin-bottom:17px}.quote{font-size:22px;line-height:1.4}.num{right:28px;bottom:22px}.photo-page{padding:14px!important}.photo-page:after{inset:14px}.photo-caption{left:28px;right:28px;bottom:45px;font-size:22px}.controls{bottom:14px}.music{bottom:14px;right:14px}.hint{bottom:22px;right:64px}.cover-book{height:76vh;min-height:480px}.closing h2{font-size:clamp(43px,12vw,62px)}}@media(max-height:650px) and (min-width:701px){.book{height:86vh}.page{padding-top:35px;padding-bottom:50px}.page h2{font-size:45px}.page p{font-size:14px;line-height:1.65}}</style></head><body><div class="cover" id="cover"><div class="cover-book"><div class="cover-content"><div class="small">sebuah surat dari hati</div><h1>Untuk<br>Varadilla</h1><p>tentang maaf, kepastian, dan masa depan.</p><button class="open" id="open">Buka Buku ♡</button></div></div></div><div class="book-wrap"><div class="book"><div class="page" id="page"></div></div></div><div class="controls"><button id="prev" aria-label="Halaman sebelumnya">‹</button><div class="counter" id="counter">1 / 17</div><button class="next" id="next">Halaman berikutnya →</button></div><button class="music" id="music" aria-label="Musik">♫</button><div class="hint" id="hint">musik</div><script>const pages=[{title:'Aku datang bukan untuk membela diri.',k:'01 · pembuka',text:'Aku datang untuk mengakui kesalahanku, meminta maaf kepadamu, dan mengatakan sesuatu yang mungkin selama ini belum kusampaikan dengan baik.',quote:'“Kali ini, aku ingin benar-benar mendengarkan.”'},{title:'Maaf, sayang.',k:'02 · permintaan maaf',text:'Aku tahu kata “maaf” tidak otomatis menghapus rasa sakit yang sudah kamu rasakan. Aku juga tahu penjelasan panjang tidak akan membuat kesalahanku menjadi benar. Karena itu, kali ini aku tidak ingin mencari alasan.',text2:'Kalau sikapku membuat kamu sedih, kecewa, marah, atau merasa tidak dihargai, aku benar-benar menyesal. Maaf karena ada saat-saat ketika aku terlalu sibuk dengan perasaanku sendiri sampai lupa bahwa kamu juga punya hati yang harus aku jaga. Aku sadar, mencintai seseorang bukan hanya soal mengatakan sayang. Cinta juga berarti tahu kapan harus mendengarkan, menahan ego, dan belajar menjadi lebih baik.',quote:'“Jadi untuk semua yang membuatmu terluka karena aku: maaf, sayang. — Azzam”'},{title:'Aku tahu kamu merasa kita berjalan di tempat.',k:'03 · yang kamu rasakan',text:'Aku mengerti kenapa kamu merasa hubungan ini seperti tidak bergerak ke mana-mana. Kamu bukan meminta sesuatu yang berlebihan. Kamu hanya ingin tahu bahwa hubungan ini punya arah, bahwa menunggu selama ini bukan tanpa tujuan.',quote:'“Aku mengerti bahwa yang kamu cari bukan sekadar kata-kata.”'},{title:'Kamu butuh kepastian.',k:'04 · yang kamu butuhkan',text:'Kamu ingin tahu apakah aku benar-benar serius. Kamu ingin ada arah yang jelas dan masa depan yang bisa kita perjuangkan bersama. Dan aku sadar, selama ini aku belum cukup membuatmu merasa yakin tentang itu.',quote:'“Kamu berhak mendapatkan kepastian, bukan terus hidup dalam pertanyaan.”'},{title:'Aku masih memilih kamu.',k:'05 · pilihanku',text:'Aku tidak ingin hubungan kita berjalan tanpa tujuan. Aku ingin memperjuangkan hubungan ini menuju sesuatu yang lebih pasti. Aku ingin menjadi laki-laki yang berani mengambil langkah, bukan hanya mengatakan “nanti”.',quote:'“Aku tidak ingin kamu menebak-nebak lagi tentang keseriusanku.”'},{title:'Aku ingin memberi kita masa depan yang jelas.',k:'06 · langkah nyata',text:'Aku akan lebih terbuka tentang rencanaku, membicarakan masa depan kita dengan serius, dan membuktikan keseriusanku melalui tindakan. Kepastian bukan sesuatu yang cukup diucapkan sekali; kepastian harus dibangun dan dibuktikan.',text2:'Dan secepatnya aku akan bicara dengan mamamu. Aku ingin menyampaikan keseriusanku, menjelaskan niatku dengan baik, dan berusaha membuat mamamu yakin bahwa aku sungguh-sungguh dengan kamu serta masa depan yang ingin kita bangun bersama.',quote:'“Aku ingin langkahku ke depan punya tujuan: kita.”'},{title:'Aku tidak ingin kenangan ini berhenti di sini.',k:'07 · kenangan',text:'Setiap foto di halaman berikutnya mengingatkanku bahwa hubungan ini punya banyak momen yang berarti. Aku tidak ingin menghapus semua itu hanya karena aku pernah gagal menjaga perasaanmu.',quote:'“Aku ingin memperbaiki yang salah, bukan melupakan yang pernah indah.”'},{title:'Aku ingin lebih banyak hari seperti ini.',k:'08 · harapan',text:'Aku ingin kita punya lebih banyak cerita. Bukan hanya cerita yang indah, tetapi juga cerita tentang dua orang yang belajar menjadi dewasa, saling memahami, dan berani menentukan masa depan.',quote:'“Kalau kamu masih memberi ruang, aku ingin mengisinya dengan keseriusan.”'},{photo:'images/1.jpg',caption:'Momen pertama — sebuah cerita yang ingin aku jaga.',k:'09 · foto 01'},{photo:'images/2.jpg',caption:'Senyum yang selalu ingin aku lihat lagi.',k:'10 · foto 02'},{photo:'images/3.jpg',caption:'Tawa kecil yang ternyata sangat berarti.',k:'11 · foto 03'},{photo:'images/4.jpg',caption:'Hari sederhana yang ingin aku ulangi.',k:'12 · foto 04'},{photo:'images/5.jpg',caption:'Satu lagi kenangan yang tidak ingin aku lepaskan.',k:'13 · foto 05'},{photo:'images/6.jpg',caption:'Karena bersamamu, hal sederhana terasa istimewa.',k:'14 · foto 06'},{photo:'images/7.jpg',caption:'Aku masih ingin punya banyak momen bersamamu.',k:'15 · foto 07'},{photo:'images/8.jpg',caption:'Dan semoga ini bukan akhir dari cerita kita.',k:'16 · foto 08'},{closing:true,k:'17 · penutup',title:'Maaf, ya sayang.',text:'Aku tidak tahu apakah kata-kata ini cukup. Mungkin tidak. Tapi aku ingin kamu tahu bahwa aku benar-benar menyesal. Aku sayang kamu, dan kalau masih ada kesempatan, aku ingin memperbaiki semuanya dengan cara yang lebih dewasa.',final:'Aku masih memilih kamu. — Azzam ♡'}];let current=0;const page=document.getElementById('page'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next');function markup(p){if(p.photo)return `<div class="page-content photo-page"><img class="photo" src="${p.photo}" alt="Kenangan Azzam dan Varadilla"><div class="photo-caption">${p.caption}</div><div class="num">${p.k}</div></div>`;if(p.closing)return `<div class="page-content closing"><div class="kicker">${p.k}</div><h2>${p.title}</h2><p>${p.text}</p><div class="final">${p.final}</div></div>`;return `<div class="page-content"><div class="kicker">${p.k}</div><h2>${p.title}</h2><p>${p.text}</p>${p.text2?`<p>${p.text2}</p>`:''}${p.quote?`<div class="quote">${p.quote}</div>`:''}<div class="num">${p.k}</div></div>`}function render(direction='next'){page.classList.remove('enter-next','enter-prev');void page.offsetWidth;page.innerHTML=markup(pages[current]);page.classList.add(direction==='prev'?'enter-prev':'enter-next');counter.textContent=`${current+1} / ${pages.length}`;prev.disabled=current===0;next.textContent=current===pages.length-1?'Kembali ke awal ↺':'Halaman berikutnya →'}function go(n){if(n<0||n>=pages.length)return;const direction=n>current?'next':'prev';current=n;render(direction)}document.getElementById('open').onclick=()=>{document.getElementById('cover').classList.add('hide');render();startMusic()};next.onclick=()=>current===pages.length-1?go(0):go(current+1);prev.onclick=()=>go(current-1);addEventListener('keydown',e=>{if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft'&&!prev.disabled)prev.click()});render();let ctx,master,playing=false,timer,step=0;function tone(f,d,v,w){let t=ctx.currentTime+w,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}function startMusic(){if(playing)return;ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.75;master.connect(ctx.destination);playing=true;music.classList.add('on');hint.textContent='musik 75%';const c=[[146.83,174.61,220],[130.81,164.81,196],[110,130.81,164.81],[98,146.83,185]];function play(){if(!playing)return;let a=c[step%4];a.forEach((f,i)=>tone(f,4.5,.07,i*.12));tone(a[2]*2,2.7,.04,1.1);step++;timer=setTimeout(play,4500)}play()}function stopMusic(){playing=false;clearTimeout(timer);if(master)master.gain.setTargetAtTime(.0001,ctx.currentTime,.15);music.classList.remove('on');hint.textContent='musik mati'}music.onclick=()=>playing?stopMusic():startMusic();</script></body></html>
